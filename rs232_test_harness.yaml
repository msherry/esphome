external_components:
  - source:
      type: local
      path: components

esphome:
  name: rs232-test-harness

esp32:
  board: esp32dev
  variant: esp32
  cpu_frequency: 240MHZ
  framework:
    type: esp-idf
    advanced:
      minimum_chip_revision: "3.1"

packages:
  device_base: !include _common.yaml

logger:
  level: DEBUG
  logs:
    text_sensor: INFO

# UART configuration matching treadmill_controller.yaml
uart:
  id: uart_bus
  tx_pin:
    number: GPIO17
    inverted: true
  rx_pin:
    number: GPIO16
    inverted: true

  baud_rate: 115200
  rx_buffer_size: 512  # Increased for safety
  # debug:
  #   direction: BOTH
  #   dummy_receiver: true

text:
  - platform: template
    name: Hex Input Box
    id: hex_input_box
    icon: mdi:keyboard
    mode: text
    optimistic: true
    min_length: 0
    max_length: 255

text_sensor:
  - platform: template
    name: RS232 Response
    id: rs232_response

binary_sensor:
  - platform: template
    name: RS232 Data Available
    id: rs232_data_available

rs232_test_harness:
  id: harness
  uart_id: uart_bus
  console_sensor: rs232_response
  data_available_sensor: rs232_data_available

pid_controller:
  id: my_pid
  kp: 0.05
  ki: 0.01
  kd: 0.02
  output_min: 2.0
  output_max: 10.0

button:
  - platform: template
    name: Send HELLO
    on_press:
      - lambda: |-
          std::vector<uint8_t> data =
            {'H','E','L','L','O','\n'};

          id(harness)->send_command(data);

  - platform: template
    name: Send Hex String
    icon: mdi:send
    on_press:
      - lambda: |-
          std::string hex = id(hex_input_box).state;

          // Remove spaces
          hex.erase(
            std::remove(hex.begin(), hex.end(), ' '),
            hex.end()
          );

          if (hex.length() == 0) {
            ESP_LOGW("rs232", "Empty hex string");
            return;
          }

          if (hex.length() % 2 != 0) {
            ESP_LOGE("rs232", "Hex string must have even length");
            return;
          }

          std::vector<uint8_t> data;
          data.reserve(hex.length() / 2);

          for (size_t i = 0; i < hex.length(); i += 2) {
            uint8_t byte =
              strtol(hex.substr(i, 2).c_str(), nullptr, 16);

            data.push_back(byte);
          }

          ESP_LOGD("rs232", "Sending %u parsed bytes", data.size());

          id(harness)->send_command(data);
