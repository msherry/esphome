esphome:
  name: rs232-test-harness
  friendly_name: RS232 Test Harness
  includes:
    - rs232_test_harness.h
  on_boot:
    priority: -10 # Run after UART is ready
    then:
      - lambda: |-
          // Pass the uart_bus ID here - this is the standard way
          auto *harness = new esphome::rs232::RS232TestHarness(id(uart_bus));
          App.register_component(harness);
          harness->set_response_sensor(id(rs232_response));
          harness->set_data_available_sensor(id(rs232_data_available));

esp32:
  board: esp32dev
  variant: esp32
  cpu_frequency: 240MHZ
  framework:
    type: esp-idf
    advanced:
      minimum_chip_revision: "3.1"

packages:
  device_base: !include _common.yaml

logger:
  level: DEBUG

# UART configuration matching treadmill_controller.yaml
uart:
  id: uart_bus
  tx_pin: GPIO17
  rx_pin:
    number: GPIO16
    inverted: false

  baud_rate: 38400
  rx_buffer_size: 512  # Increased for safety
  debug:
    direction: BOTH
    dummy_receiver: true

# Global variable to store command buffer
globals:
  - id: command_buffer
    type: std::vector<uint8_t>
    restore_value: no
    initial_value: "std::vector<uint8_t>()"

# Scripts to send arbitrary bytes via UART
script:
  # Send bytes from the global buffer and clear it
  - id: send_rs232_command
    then:
      - lambda: |-
          auto* harness = esphome::rs232::RS232TestHarness::get_instance();
          harness->send_command(id(command_buffer));
          id(command_buffer).clear();

# Text sensor to display received data
text_sensor:
  - platform: template
    name: "Last RS232 Response"
    id: rs232_response
    icon: 'mdi:serial'
    update_interval: 1s

# Text input component for hex string entry
text:
  - platform: template
    name: "Hex Input Box"
    id: hex_input_box
    icon: "mdi:keyboard"
    mode: text
    optimistic: true
    min_length: 0
    max_length: 128
    initial_value: ""

# Binary sensor to indicate data availability
binary_sensor:
  - platform: template
    name: "RS232 Data Available"
    id: rs232_data_available
    icon: 'mdi:signal'
    device_class: connectivity
    filters:
      - delayed_off: 5s  # Keeps the light on for 5 seconds after data stops

  # - platform: gpio
  #   pin:
  #     number: GPIO16
  #     mode: INPUT_PULLDOWN
  #   name: "RX Pin Physical Test"

# Button to clear the response display
button:
  - platform: template
    name: "Clear Response"
    icon: 'mdi:eraser'
    on_press:
      - text_sensor.template.publish:
          id: rs232_response
          state: ""

  # Button to send hex string directly
  - platform: template
    name: "Send Hex String"
    on_press:
      - lambda: |-
          auto* harness = esphome::rs232::RS232TestHarness::get_instance();
          if (harness == nullptr) {
            ESP_LOGE("rs232", "Harness not ready yet!");
            return;
          }

          std::string hex = id(hex_input_box).state;
          hex.erase(std::remove(hex.begin(), hex.end(), ' '), hex.end());

          if (hex.length() % 2 != 0) return;

          std::vector<uint8_t> data;
          for (size_t i = 0; i < hex.length(); i += 2) {
            data.push_back((uint8_t) strtol(hex.substr(i, 2).c_str(), nullptr, 16));
          }
          harness->send_command(data);

  - platform: template
    name: "Software Pulse"
    on_press:
      - lambda: |-
          id(uart_bus).write_str("HELLO\n");
