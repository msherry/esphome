esphome:
  includes:
    - treadmill_controller.h


esp32:
  board: esp32dev
  variant: esp32
  cpu_frequency: 240MHZ
  framework:
    type: esp-idf
    advanced:
      minimum_chip_revision: "3.1"

packages:
  device_base: !include _common.yaml

logger:
  level: DEBUG

globals:
  id: treadmill_speed
  type: float
  restore_value: no
  initial_value: '0.0'


# Setup the UART for the MAX3232 connection
uart:
  id: treadmill_bus
  tx_pin: GPIO17
  rx_pin: GPIO16
  baud_rate: 38400

# For reading heart rate data
esp32_ble_tracker:
  on_ble_advertise:
    - then:
        lambda: |-
          if (x.get_name() == HEARTCAST || x.get_name() == ECHO) {
            // Check if we are already connected or connecting
            if (!id(heartcast_client).connected()) {
              ESP_LOGD("heartcast", "Found HeartCast at %s! Connecting...", x.address_str().c_str());

              // Use address_uint64() to get the numerical format the client needs
              id(heartcast_client).set_address(x.address_uint64());
              id(heartcast_client).connect();
            }
          }

# text_sensor:
#   # View BLE scanner results - spews lots of logs
#   - platform: ble_scanner
#     name: "BLE Devices Scanner"

ble_client:
  - mac_address: 00:00:00:00:00:00
    id: heartcast_client
    auto_connect: false  # We handle connection via the scanner
    on_connect:
      then:
        - lambda: |-
            ESP_LOGD("ble_custom", "Connected! Attempting to enable notifications...");
    on_disconnect:
      then:
        - lambda: |-
            ESP_LOGD("ble_custom", "Disconnected from HeartCast.");

# TODO: display screen
#  - connecting status indicator
#  - live HR when connected
# TODO: pid loop
# TODO: CSAFE
#  - receive/parse
#  - encode/transmit

sensor:
  - platform: ble_client
    type: characteristic
    ble_client_id: heartcast_client
    name: "Apple Watch Heart Rate"
    id: hr_sensor
    service_uuid: '180d'        # Per BLE spec
    characteristic_uuid: '2a37' # Per BLE spec
    # descriptor_uuid: '2902'
    icon: 'mdi:heart-pulse'
    unit_of_measurement: "BPM"
    accuracy_decimals: 0
    notify: true  # This allows the iPhone to push updates to the ESP32
    update_interval: never # Don't poll -- wait for notifications
    lambda: |-
        // The first byte (x[0]) contains flags.
        // If bit 0 is 0, heart rate is in x[1] (uint8).
        // If bit 0 is 1, heart rate is in x[1] and x[2] (uint16).
        // ESP_LOGI("treadmill_controller", "x[0]: %x  x[1]: %x  x[2]: %x", x[0], x[1], x[2]);
        if (x.size() >= 2) {
          return (x[0] & 0x01) ? (float)((x[2] << 8) | x[1]) : (float)x[1];
        }
        return NAN;


interval:
  - interval: 15s
    then:
      - lambda: |-
          const float target_hr = 140;    // TODO: configurable
          float speed = id(treadmill_speed);

          float hr = id(hr_sensor).state;

          if (isnan(hr))
            return;


          // Within 5 BPM of target, do nothing
          if (hr >= target_hr - 5 && hr <= target_hr + 5)
            return;


          if (hr >= target_hr + 20) {
            speed -= 0.2;
          } else if (hr >= target_hr + 10) {
            speed -= 0.1;
          } else if (hr <= target_hr - 20) {
            speed += 0.2;
          } else if (hr <= target_hr - 10) {
            speed += 0.2;
          }

          if (speed > 12.0) speed = 12.0;
          if (speed < 3.0) speed = 3.0;

          id(set_treadmill_speed).execute(speed);

script:
  - id: set_treadmill_speed
    parameters:
      speed: float
    then:
      - lambda: |-
          // speed is PID output speed

          if (speed > 12.0) speed = 12.0;
          if (speed < 3.0) speed = 3.0;
          ESP_LOGD("csafe", "PID setting speed to %.1f mph", speed);

          // TODO: send the csafe here

          // TODO: read back the speed from csafe?
          id(treadmill_speed) = speed;
