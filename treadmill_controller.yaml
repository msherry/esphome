external_components:
  - source:
      type: local
      path: components

esphome:
  includes:
    - treadmill_controller.h

esp32:
  board: esp32dev
  variant: esp32
  cpu_frequency: 240MHZ
  framework:
    type: esp-idf
    advanced:
      minimum_chip_revision: "3.1"

packages:
  device_base: !include _common.yaml

logger:
  level: DEBUG

globals:
  # Accumulator and count for hr average
  - id: hr_sum
    type: float
    restore_value: no
    initial_value: '0.0'
  - id: hr_count
    type: float
    restore_value: no
    initial_value: '0.0'
  - id: hr_average
    type: float
    restore_value: no
    initial_value: '0.0'
  # Actuator controls
  - id: desired_speed
    type: float
    restore_value: no
    initial_value: '0.0'
  - id: commanded_speed
    type: float
    restore_value: no
    initial_value: '0.0'

wifi:
  fast_connect: true

# Setup the UART for the MAX3232 connection
uart:
  id: treadmill_bus
  tx_pin:
    number: GPIO17
    inverted: true
  rx_pin:
    number: GPIO16
    inverted: true
  baud_rate: 115200

treadmill_csafe_parser:
  id: csafe_parser
  uart_id: treadmill_bus

# For reading heart rate data
esp32_ble_tracker:
  on_ble_advertise:
    - then:
        lambda: |-
          if (x.get_name() == HEARTCAST || x.get_name() == ECHO) {
            // Check if we are already connected or connecting
            if (!id(heartcast_client).connected()) {
              ESP_LOGD("heartcast", "Found HeartCast at %s! Connecting...", x.address_str().c_str());

              // Use address_uint64() to get the numerical format the client needs
              id(heartcast_client).set_address(x.address_uint64());
              id(heartcast_client).connect();
            }
          }

# text_sensor:
#   # View BLE scanner results - spews lots of logs
#   - platform: ble_scanner
#     name: "BLE Devices Scanner"

ble_client:
  - mac_address: 00:00:00:00:00:00
    id: heartcast_client
    auto_connect: false  # We handle connection via the scanner
    on_connect:
      then:
        - lambda: |-
            ESP_LOGD("ble_custom", "Connected! Attempting to enable notifications...");
    on_disconnect:
      then:
        - lambda: |-
            ESP_LOGD("ble_custom", "Disconnected from HeartCast.");

