external_components:
  - source:
      type: local
      path: components

esphome:
  includes:
    - treadmill_controller.h

esp32:
  board: esp32dev
  variant: esp32
  cpu_frequency: 240MHZ
  framework:
    type: esp-idf
    advanced:
      minimum_chip_revision: "3.1"

packages:
  device_base: !include _common.yaml

web_server:
  sorting_groups:
    - id: "sorting_group_hr"
      name: "Heart rate"
      sorting_weight: -2
    - id: "sorting_group_pid"
      name: "PID control"
      sorting_weight: -1

logger:
  level: DEBUG
  logs:
    sensor: INFO

globals:
  # Rolling exp. weighted moving average for heart weight
  - id: hr_count
    type: float
    restore_value: no
    initial_value: '0.0'
  - id: hr_average
    type: float
    restore_value: no
    initial_value: '0.0'
  # Actuator controls
  - id: desired_speed
    type: float
    restore_value: no
    initial_value: '0.0'
  - id: commanded_speed
    type: float
    restore_value: no
    initial_value: '0.0'
  - id: commanded_speed_sum
    type: float
    restore_value: no
    initial_value: '0.0'
  - id: commanded_speed_count
    type: float
    restore_value: no
    initial_value: '0.0'
  - id: commanded_speed_avg
    type: float
    restore_value: no
    initial_value: '0.0'
  # Flags
  - id: flash_screen_time
    type: float
    restore_value: no
    initial_value: '0.0'
  - id: ble_connecting
    type: int
    restore_value: no
    initial_value: '0'

wifi:
  fast_connect: true

# Setup the UART for the MAX3232 connection
uart:
  id: treadmill_bus
  tx_pin:
    number: GPIO17
    inverted: true
  rx_pin:
    number: GPIO16
    inverted: true
  baud_rate: 115200

treadmill_csafe_parser:
  id: csafe_parser
  uart_id: treadmill_bus

# For reading heart rate data
esp32_ble_tracker:
  on_ble_advertise:
    - then:
        lambda: |-
          if (!id(heartcast_client).connected() && !id(ble_connecting)) {
            if (x.get_name().find(POLAR) != std::string::npos
                || x.get_name() == HEARTCAST
                || x.get_name() == ECHO
               ) {
              ESP_LOGD("heartcast", "Found %s at %s! Connecting...", x.get_name().c_str(), x.address_str().c_str());

              // Use address_uint64() to get the numerical format the client needs
              id(heartcast_client).set_address(x.address_uint64());
              id(heartcast_client).connect();

              id(ble_connecting) = 1;
            }
          }

# text_sensor:
#   # View BLE scanner results - spews lots of logs
#   - platform: ble_scanner
#     name: "BLE Devices Scanner"

ble_client:
  - mac_address: 00:00:00:00:00:00
    id: heartcast_client
    auto_connect: false  # We handle connection via the scanner
    on_connect:
      then:
        - lambda: |-
            ESP_LOGD("ble_custom", "Connected! Attempting to enable notifications...");
            id(ble_connecting) = 0;
    on_disconnect:
      then:
        - lambda: |-
            ESP_LOGD("ble_custom", "Disconnected from HeartCast.");
            id(ble_connecting) = 0;

font:
  - file: 'SourceSansPro-Light.ttf'
    id: font1
    size: 22
  - file: 'SourceSansPro-Light.ttf'
    id: font2
    size: 12
  - file: 'materialdesignicons-webfont.ttf'
    id: font3
    size: 16
    glyphs:
      - "\U000F19B0" # "arrow-right-thin"
  - file: 'materialdesignicons-webfont.ttf'
    id: font4
    size: 34
    glyphs:
      - "\U000F02D1" # "heart"
      - "\U000F02D5" # "heart-outline"
      - "\U000F046E" # "run-fast"
      - "\U000F0667" # "stop-circle-outline"
      - "\U000F070E" # "run"


i2c:
  sda: GPIO21
  scl: GPIO22
  scan: false

display:
  - id: main_display
    platform: ssd1306_i2c
    model: "SSD1306 128x64"
    rotation: 0
    # reset_pin: D0
    address: 0x3C
    show_test_card: false
    update_interval: 1s
    lambda: |-
      int screen_height = it.get_height();
      int screen_width = it.get_width();

      if (millis() - id(flash_screen_time) < 250) {
        it.filled_rectangle(0, 0, screen_width, screen_height);
        return;
      }

      // HR zone rectangle
      float zone_gap = 5;
      float zone_height = screen_height - (2 * zone_gap);

      // Position within zone calcs
      float zone_spread = 2 * id(target_zone_width).state;
      float zone_pct = min(1.0f, max(0.0f,
                           (id(hr_average) - (id(target_hr).state - id(target_zone_width).state))
                           / zone_spread));

      float speed = id(commanded_speed);
      auto run_glyph = id(workout_active).state ? (speed >= id(commanded_speed_avg) ? "\U000F046E" : "\U000F070E") : "\U000F0667";
      // Heart glyph
      it.printf(0, 26, id(font4), TextAlign::BASELINE_LEFT, id(heartcast_client).connected() ? "\U000F02D1" : "\U000F02D5");
      // Heart rate
      it.printf(40, 0, id(font1), "%.0f", id(hr_average));
      // Run glyph
      it.printf(0, screen_height - 2, id(font4), TextAlign::BASELINE_LEFT, run_glyph);
      // Print current speed
      it.printf(40, screen_height - 26, id(font1), "%.1f", speed);
      // Zone vertical bar
      it.filled_rectangle(screen_width-32, (screen_height - zone_height) / 2, 10, zone_height);
      // Zone low value
      it.printf(screen_width-20, (screen_height - zone_height) / 2 - 3, id(font2), TextAlign::TOP_LEFT,
                "%.0f", id(target_hr).state - id(target_zone_width).state);
      // Zone high value
      it.printf(screen_width-20, (screen_height - zone_gap), id(font2), TextAlign::BASELINE_LEFT,
                "%.0f", id(target_hr).state + id(target_zone_width).state);
      // HR zone indicator
      it.printf(screen_width-46, zone_gap + zone_pct * (zone_height - 3) - 5,
                id(font3), TextAlign::TOP_LEFT, "\U000F19B0");


number:
  - platform: template
    name: "Maximum heart rate"
    id: max_hr
    unit_of_measurement: "BPM"
    icon: "mdi:heart-plus"
    min_value: 150
    max_value: 220
    restore_value: true
    optimistic: true
    step: 1
    web_server:
      sorting_group_id: sorting_group_hr
      sorting_weight: 10
    on_value:
      - script.execute:
          id: calculate_hr_zone

  - platform: template
    name: "Minimum heart rate"
    id: min_hr
    unit_of_measurement: "BPM"
    icon: "mdi:heart-minus"
    min_value: 30
    max_value: 90
    restore_value: true
    optimistic: true
    step: 1
    web_server:
      sorting_group_id: sorting_group_hr
      sorting_weight: 20
    on_value:
      - script.execute:
          id: calculate_hr_zone

  - platform: template
    name: "Target heart rate"
    id: target_hr
    unit_of_measurement: "BPM"
    icon: "mdi:bullseye-arrow"
    min_value: 80
    max_value: 200
    restore_value: true
    optimistic: true
    step: 1
    web_server:
      sorting_group_id: sorting_group_hr
      sorting_weight: 30

  - platform: template
    name: "HR zone width"
    id: target_zone_width
    unit_of_measurement: "BPM"
    icon: "mdi:arrow-expand-horizontal"
    min_value: 5
    max_value: 12
    restore_value: true
    optimistic: true
    step: 1
    web_server:
      sorting_group_id: sorting_group_hr
      sorting_weight: 40

select:
  - platform: template
    name: "HR zone"
    id: hr_zone
    options:
      - "Zone 1"
      - "Zone 2"
      - "Zone 3"
      - "Zone 4"
      - "Zone 5"
    optimistic: true
    restore_value: true
    initial_option: "Zone 2"
    icon: mdi:layers
    web_server:
      sorting_group_id: sorting_group_hr
      sorting_weight: 50
    on_value:
      - script.execute:
          id: calculate_hr_zone

pid_controller:
  - id: treadmill_pid
    kp: 0.04
    ki: 0.001
    kd: 0.02
    output_min: 3.0
    output_max: 12.0

sensor:
  - platform: ble_client
    type: characteristic
    ble_client_id: heartcast_client
    name: "Heart Rate"
    id: hr_sensor
    service_uuid: '180d'        # Per BLE spec
    characteristic_uuid: '2a37' # Per BLE spec
    # descriptor_uuid: '2902'
    icon: 'mdi:heart-pulse'
    unit_of_measurement: "BPM"
    accuracy_decimals: 0
    internal: true
    notify: true  # This allows the iPhone to push updates to the ESP32
    update_interval: never # Don't poll -- wait for notifications
    lambda: |-
        // The first byte (x[0]) contains flags.
        // If bit 0 is 0, heart rate is in x[1] (uint8).
        // If bit 0 is 1, heart rate is in x[1] and x[2] (uint16).
        // ESP_LOGI("treadmill_controller", "x[0]: %x  x[1]: %x  x[2]: %x", x[0], x[1], x[2]);
        if (x.size() >= 2) {
          return (x[0] & 0x01) ? (float)((x[2] << 8) | x[1]) : (float)x[1];
        }
        return NAN;
    on_value:
      - lambda: |
          float alpha = 0.80;
          if (!isnan(x)) {
            id(hr_count) += 1;
            if (id(hr_average) > 0) {
              // Exponential moving average
              id(hr_average) = alpha * x + (1 - alpha) * id(hr_average);
            } else {
              id(hr_average) = x;
            }
          }
  - platform: ble_client
    type: characteristic
    ble_client_id: heartcast_client
    name: "HRM Battery Level"
    id: hrm_battery
    service_uuid: '180f'        # Battery service
    characteristic_uuid: '2a19' # Battery level
    icon: 'mdi:battery-heart-variant'
    unit_of_measurement: '%'
    accuracy_decimals: 0
    notify: false
    update_interval: 60s
    lambda: |
      if (x.size() >= 1) {
        return (float)x[0];
      }
      return NAN;
    on_value:
      - lambda: |
          if (x < 20) {
            ESP_LOGW("battery", "HRM battery low: %.0f%%", x);
          }


  - platform: template
    name: "HR Average"
    id: hr_average_sensor
    unit_of_measurement: "BPM"
    accuracy_decimals: 0
    icon: 'mdi:heart-pulse'
    web_server:
      sorting_group_id: sorting_group_hr
      sorting_weight: 100

  - platform: template
    name: "PID Commanded Speed"
    id: pid_commanded_sensor
    unit_of_measurement: "mph"
    accuracy_decimals: 1
    icon: "mdi:speedometer"
    web_server:
      sorting_group_id: sorting_group_pid
      sorting_weight: 10

  - platform: template
    name: "PID Desired Speed"
    id: pid_desired_sensor
    unit_of_measurement: "mph"
    accuracy_decimals: 1
    icon: "mdi:flag-checkered"
    web_server:
      sorting_group_id: sorting_group_pid
      sorting_weight: 20

  # PID debugging
  - platform: template
    name: "PID Error"
    id: pid_error_sensor
    unit_of_measurement: "BPM"
    accuracy_decimals: 1
    icon: "mdi:crosshairs"
    web_server:
      sorting_group_id: sorting_group_pid
      sorting_weight: 30

  - platform: template
    name: "PID Proportional"
    id: pid_p_sensor
    unit_of_measurement: "mph"
    accuracy_decimals: 2
    icon: "mdi:scale-balance"
    web_server:
      sorting_group_id: sorting_group_pid
      sorting_weight: 40

  - platform: template
    name: "PID Integral"
    id: pid_i_sensor
    unit_of_measurement: "mph"
    accuracy_decimals: 2
    icon: "mdi:sigma"
    web_server:
      sorting_group_id: sorting_group_pid
      sorting_weight: 50

  - platform: template
    name: "PID Derivative"
    id: pid_d_sensor
    unit_of_measurement: "mph"
    accuracy_decimals: 2
    icon: "mdi:chart-bell-curve"
    web_server:
      sorting_group_id: sorting_group_pid
      sorting_weight: 60

  - platform: template
    name: "PID Commanded Speed Avg"
    id: pid_commanded_sensor_avg
    unit_of_measurement: "mph"
    accuracy_decimals: 1
    icon: "mdi:speedometer-medium"
    web_server:
      sorting_group_id: sorting_group_pid
      sorting_weight: 70

interval:
  # # Get the treadmill's reported speed
  # - interval: 30s
  #   then:
  #     - lambda: |-
  #         // Do nothing if the workout is not active
  #         if (!id(workout_active.state)) return;
  #
  #         float polled_speed = id(csafe_parser).get_last_speed();
  #         if (abs(polled_speed - id(commanded_speed)) > 0.3f) {
  #           ESP_LOGI("actuator", "Speed mismatch: commanded %.1f, actual %.1f — syncing",
  #                    id(commanded_speed), polled_speed);
  #           id(commanded_speed) = polled_speed;
  #         }

  # PID update
  - interval: 15s
    then:
      - lambda: |-
          if (id(hr_count) > 0) {
            float target = id(target_hr).state;
            float error = target - id(hr_average);

            ESP_LOGI("pid", "HR average over last 15s: %.0f BPM from %d samples",
                     id(hr_average), (int)id(hr_count));

            id(hr_average_sensor).publish_state(id(hr_average));
            // Reset count
            id(hr_count) = 0.0;

            // No PID updates if we're not in an active workout
            if (id(workout_active).state) {
              // Use PID controller to calculate target speed
              // Error = Target HR - Current HR (positive means we need to increase speed)
              // ESP_LOGD("pid", "Updating PID controller");
              float speed = id(treadmill_pid).update(target, id(hr_average), millis());

              // ESP_LOGD("pid", "Setting desired speed to %.1f mph", speed);
              id(desired_speed) = speed;

              // Publish stats to HA
              // PID debugging
              id(pid_error_sensor).publish_state(error);
              id(pid_p_sensor).publish_state(id(treadmill_pid).get_proportional());
              id(pid_i_sensor).publish_state(id(treadmill_pid).get_integral());
              id(pid_d_sensor).publish_state(id(treadmill_pid).get_derivative());
              id(pid_desired_sensor).publish_state(speed);
            }
          } else {
            // ESP_LOGI("pid", "No HR samples received in last N seconds");
            return;
          }
  # Actuator - update treadmill speed based on desired speed
  - interval: 15s
    then:
      - lambda: |-
          // Do nothing if the workout is not active
          if (!id(workout_active).state) return;

          float delta = id(desired_speed) - id(commanded_speed);
          float abs_delta = abs(delta);

          // Check if we're outside the deadband before doing updates
          if (abs_delta >= 0.05f) {
            float step;
            if (abs_delta > 2.0f) step = 1.0f;
            else if (abs_delta > 1.0f) step = 0.3f;
            else if (abs_delta > 0.5f) step = 0.2f;
            else if (abs_delta > 0.2f) step = 0.1f;
            else step = 0.05f;

            // Step toward desired, don't overshoot
            float new_speed;
            if (delta > 0) {
              new_speed = min(id(commanded_speed) + step, id(desired_speed));
            } else {
              new_speed = max(id(commanded_speed) - step, id(desired_speed));
            }

            // Round to nearest 0.1mph
            new_speed = std::round(new_speed * 10.0f) / 10.0f;

            ESP_LOGI("actuator", "Stepping speed: %.2f -> %.2f (desired: %.2f, delta was: %.2f)",
                     id(commanded_speed), new_speed, id(desired_speed), delta);

            if (id(commanded_speed) != new_speed) {
              // The speed changed - flash the display
              id(flash_screen_time) = millis();
              id(main_display).update();
            }

            id(commanded_speed) = new_speed;
            // id(set_treadmill_speed).execute(new_speed);
          }

          id(commanded_speed_sum) += id(commanded_speed);
          id(commanded_speed_count) += 1;
          id(commanded_speed_avg) = id(commanded_speed_sum) / id(commanded_speed_count);

          // Publish stats to HA
          id(pid_commanded_sensor).publish_state(id(commanded_speed));
          id(pid_commanded_sensor_avg).publish_state(id(commanded_speed_avg));

script:
  - id: set_treadmill_speed
    parameters:
      speed: float
    then:
      - lambda: |-
          // Do nothing if the workout is not active
          if (!id(workout_active).state) return;

          // Send CSAFE command to set the speed
          // NOTE: untested, we don't have a compatible treadmill :(
          id(csafe_parser).set_speed(speed);
          id(csafe_parser).get_speed();  // response handled async by loop()

  - id: calculate_hr_zone
    then:
      - lambda: |-
          float hr_max = id(max_hr).state;
          float hr_min = id(min_hr).state;

          float zone_lower_bound;
          std::string zone = id(hr_zone).current_option();
          if (zone == "Zone 1") {
              zone_lower_bound = 0.5;
          } else if (zone == "Zone 2") {
              zone_lower_bound = 0.6;
          } else if (zone == "Zone 3") {
              zone_lower_bound = 0.7;
          } else if (zone == "Zone 4") {
              zone_lower_bound = 0.8;
          } else if (zone == "Zone 5") {
              zone_lower_bound = 0.9;
          }

          // Karvonen formula
          float zone_min = std::round(hr_min + zone_lower_bound * (hr_max - hr_min));
          float zone_max = std::round(hr_min + (zone_lower_bound + 0.1) * (hr_max - hr_min));

          id(target_hr).publish_state(std::round((zone_min + zone_max) / 2.0f));
          id(target_zone_width).publish_state(std::round((zone_max - zone_min) / 2.0f));

switch:
  - id: workout_active
    platform: template
    name: "Workout active"
    optimistic: true
    icon: "mdi:run"
    turn_on_action:
      # Reset PID controller
      - lambda: |
          id(treadmill_pid).reset();
      # Reset actuator
      - globals.set:
          id: desired_speed
          value: '0'
      - globals.set:
          id: commanded_speed
          value: '0'
      - globals.set:
          id: commanded_speed_sum
          value: '0'
      - globals.set:
          id: commanded_speed_count
          value: '0'
      - globals.set:
          id: commanded_speed_avg
          value: '0'
      # Reset heart rate stats
      - globals.set:
          id: hr_count
          value: '0'
      - globals.set:
          id: hr_average
          value: '0'
      - component.update: main_display
    turn_off_action:
      # Reset PID controller
      - lambda: |
          id(treadmill_pid).reset();
      # Reset actuator
      - globals.set:
          id: desired_speed
          value: '0'
      - globals.set:
          id: commanded_speed
          value: '0'
      - globals.set:
          id: commanded_speed_sum
          value: '0'
      - globals.set:
          id: commanded_speed_count
          value: '0'
      - globals.set:
          id: commanded_speed_avg
          value: '0'
      # Reset heart rate stats
      - globals.set:
          id: hr_count
          value: '0'
      - globals.set:
          id: hr_average
          value: '0'
      - component.update: main_display
